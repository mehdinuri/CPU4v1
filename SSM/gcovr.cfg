# gcovr defaults for SSM.
#
# The production filter (Tasks/) is intentionally NOT set here so it
# can be passed per-call in build-test.sh and in CI. This allows the full-
# instrumentation report to run without a filter while the gated report
# still targets Tasks/ only.
#
# fail-under-line: minimum line coverage % required for the Tasks gate.
# Raise this as domain logic is extracted into testable units.
fail-under-line = 0

print-summary = yes
