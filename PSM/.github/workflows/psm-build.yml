name: PSM — STM32 Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:
  build-stm32:
    name: Build STM32G473 Firmware
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake ninja-build

      - name: Configure (Debug)
        run: cmake --preset STM32-GCC-Debug

      - name: Build (Debug)
        run: cmake --build --preset STM32-GCC-Debug

      - name: Configure (Release)
        run: cmake --preset STM32-GCC-Release

      - name: Build (Release)
        run: cmake --build --preset STM32-GCC-Release

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: psm-firmware-${{ github.sha }}
          path: |
            build/STM32-GCC-Release/PSM.elf
            build/STM32-GCC-Release/PSM.map
          retention-days: 30
