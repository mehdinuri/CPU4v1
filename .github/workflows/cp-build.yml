name: CP — STM32 Firmware Build

on:
  push:
    branches: [main]
    paths: ['CPM/CP**']
  pull_request:
    branches: [main]
    paths: ['CPM/CP**']
  workflow_dispatch:
  workflow_call:

jobs:
  build-stm32:
    name: Build STM32H743 Firmware
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: CP

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install ARM toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake ninja-build

      - name: Configure (Debug)
        run: cmake --preset STM32-Debug

      - name: Build (Debug)
        run: cmake --build --preset STM32-Debug

      - name: Configure (Release)
        run: cmake --preset STM32-Release

      - name: Build (Release)
        run: cmake --build --preset STM32-Release

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cp-firmware-${{ github.sha }}
          path: |
            CPM/CPbuild/STM32-Release/CP.elf
            CPM/CPbuild/STM32-Release/CP.map
          retention-days: 30
