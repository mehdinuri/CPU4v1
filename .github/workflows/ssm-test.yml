name: SSM — Host Unit Tests

on:
  push:
    paths: ['SSM/**']
  pull_request:
    paths: ['SSM/**']
  workflow_dispatch:
    inputs:
      min_line_coverage:
        description: 'Minimum line coverage % to enforce (overrides gcovr.cfg)'
        required: false
        default: '0'
  workflow_call:
    inputs:
      min_line_coverage:
        description: 'Minimum line coverage % to enforce'
        required: false
        default: '0'
        type: string

jobs:
  test:
    name: Unit & Integration Tests (x86-64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: SSM

    env:
      # Optional override for gcovr.cfg's fail-under-line. Leave empty to use
      # the repo default (App/Domain/ at 80%). Can be overridden via
      # workflow_dispatch input or workflow_call input.
      MIN_LINE_COVERAGE: ${{ inputs.min_line_coverage || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc cmake ninja-build gcovr python3 libasan8 libubsan1

      - name: Configure
        run: cmake --preset Host-Test

      - name: Build
        run: cmake --build --preset Host-Test

      - name: Run tests
        run: |
          cd build/Host-Test
          ctest --output-on-failure

      - name: Generate coverage reports
        run: |
          mkdir -p build/coverage/full build/coverage/domain
          gcovr \
            --root . \
            --fail-under-line 0 \
            --html-details build/coverage/full/index.html \
            --print-summary \
            build/Host-Test
          GCOVR_ARGS=(--root . --xml build/coverage/domain/coverage.xml \
                      --html-details build/coverage/domain/index.html --print-summary)
          if [ -n "${MIN_LINE_COVERAGE:-}" ]; then
            GCOVR_ARGS+=(--fail-under-line "$MIN_LINE_COVERAGE")
          fi
          gcovr "${GCOVR_ARGS[@]}" build/Host-Test

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ssm-coverage-${{ github.sha }}
          path: SSM/build/coverage/
          retention-days: 7
