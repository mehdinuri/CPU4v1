# gcovr defaults for MP.
#
# The production filter (App/Domain/) is intentionally NOT set here so it
# can be passed per-call in build-test.sh and in CI. This allows the full-
# instrumentation report to run without a filter while the gated report
# still targets App/Domain/ only.
#
# fail-under-line: minimum line coverage % required for the Domain gate.
# Plan target is 80%; current measurement is 85%+.
# Overridable at call-site with --fail-under-line N, or via MIN_LINE_COVERAGE
# env var consumed by Tools/Scripts/build-test.sh.
fail-under-line = 80

print-summary = yes
