# Uncrustify Configuration for MISRA C Compliance
# This configuration enforces formatting that aligns with MISRA C guidelines
# Compatible with Uncrustify 0.72+
# 
# MISRA C Key Formatting Principles:
# - Always use braces for control structures (Rule 15.6)
# - Clear and consistent indentation
# - One statement per line
# - Clear operator spacing
# - Explicit parentheses usage

#
# General Options
#
input_tab_size                  = 2        # Tab size for input
output_tab_size                 = 2        # Tab size for output  
indent_columns                  = 2        # 4-space indentation (MISRA recommended)
indent_with_tabs                = 0        # Use spaces, not tabs (MISRA preference)
code_width                      = 80       # MISRA recommends 80 char limit
indent_switch_case              = 4        # Indent case statements (MISRA style)
indent_case_brace               = 0        # Don't extra-indent case braces

#
# Line endings and encoding
#
newlines                        = crlf       # Consistent line endings
utf8_bom                        = remove   # Remove UTF-8 BOM
utf8_byte                       = false    # Don't force UTF-8

#
# Braces - MISRA Rule 15.6: Always use braces
#
mod_full_brace_do               = add      # MISRA 15.6: Always braces for do-while
mod_full_brace_for              = add      # MISRA 15.6: Always braces for for loops
mod_full_brace_if               = add      # MISRA 15.6: Always braces for if
mod_full_brace_while            = add      # MISRA 15.6: Always braces for while
mod_full_brace_using            = add      # Always braces for using
mod_full_brace_if_chain         = 0        # All if-else chains must have braces
mod_full_brace_if_chain_only    = false    # Apply to all, not just chains

#
# Brace placement - Consistent style (K&R common in MISRA projects)
#
nl_enum_brace                   = add      # Enum brace on new line
nl_struct_brace                 = add      # Struct brace on new line
nl_union_brace                  = add      # Union brace on new line
nl_if_brace                     = add      # If brace on new line
nl_brace_else                   = add      # } else on separate lines
nl_elseif_brace                 = add      # else if brace on new line
nl_else_brace                   = add      # else brace on new line
nl_for_brace                    = add      # for brace on new line
nl_while_brace                  = add      # while brace on new line
nl_do_brace                     = add      # do brace on new line
nl_switch_brace                 = add      # switch brace on new line
nl_fdef_brace                   = add      # Function definition brace on new line
nl_brace_while                  = remove   # } while on same line for do-while
nl_case_colon_brace             = add      # Newline between case: and {

#
# Functions - MISRA prefers clear function signatures
#
nl_func_type_name               = remove   # Return type and name on same line
nl_func_proto_type_name         = remove   # Prototype on same line
nl_func_paren                   = remove   # No newline before (
nl_func_def_paren               = remove   # No newline before ( in definition
nl_func_decl_start              = remove   # No blank before declaration
nl_func_def_start               = remove   # No blank before definition
nl_func_decl_end                = remove   # No blank after declaration
nl_func_def_end                 = remove   # No blank line after function definition
nl_after_func_body              = 2        # Two blanks after function body
nl_after_func_proto             = 0        # No blanks after prototype
nl_after_func_proto_group       = 2        # Two blanks after prototype group
nl_return_expr                  = remove   # return(x) not return (x) - MISRA style

#
# Spacing - MISRA emphasizes readability
#
sp_assign                       = force      # Space around = (readability)
sp_before_assign                = force    # Force exactly 1 space before =
sp_after_assign                 = force    # Force exactly 1 space after =
sp_arith                        = add      # Space around +, -, *, / (readability)
sp_arith_additive               = add      # Space around + and -
sp_bool                         = add      # Space around boolean && || (readability)
sp_compare                      = add      # Space around comparisons (readability)
sp_inside_paren                 = remove   # No space inside ()
sp_inside_square                = remove   # No space inside []
sp_inside_paren_cast            = remove   # No space inside cast ()
sp_before_ptr_star              = add      # Space before * in pointer
sp_before_unnamed_ptr_star      = add      # Space before * in unnamed pointer
sp_after_ptr_star               = remove      # No space after * in pointer
sp_after_ptr_star_func          = remove   # No space after * in function pointer
sp_between_ptr_star             = remove   # No space between ** 
sp_before_byref                 = add      # Space before & reference
sp_after_byref                  = remove   # No space after & reference
sp_after_comma                  = add      # Space after comma (readability)
sp_before_comma                 = remove   # No space before comma
sp_after_cast                   = add      # Space after cast - MISRA readability
sp_sizeof_paren                 = remove   # sizeof(x) not sizeof (x)
sp_type_func                    = force    # Force exactly 1 space
sp_after_type                   = force    # Force single space after type
sp_func_proto_paren             = remove   # function() not function ()
sp_func_def_paren               = remove   # function() not function ()
sp_func_call_paren              = remove   # function() not function ()
sp_before_sparen                = add      # if (, while (, for ( - MISRA style
sp_after_sparen                 = remove   # ) { with space
sp_inside_sparen                = remove   # No space inside control ()
sp_else_brace                   = add      # else {
sp_brace_else                   = add      # } else
sp_before_semi                  = remove   # No space before ;
sp_after_semi                   = add      # Space after ; except at end of line
sp_after_semi_for               = add      # Space after ; in for loops
sp_after_semi_for_empty         = remove   # No space if empty in for(;;)
sp_before_square                = remove   # No space before [
sp_inside_square                = remove   # No space inside []
sp_after_operator               = remove   # No space after unary operator
sp_after_operator_sym           = remove   # No space after operator symbol
sp_inside_braces                = add      # Space inside {} for arrays
sp_inside_braces_struct         = add      # Space inside {} for structs
sp_inside_braces_enum           = add      # Space inside {} for enums
sp_inside_type_brace_init_lst   = remove   # Remove spaces in type brace init
sp_before_bit_colon             = force    # Force 1 space before :
sp_after_bit_colon              = force    # Force 1 space after :
sp_pp_concat                    = remove   # Remove spaces around ##
sp_pp_stringify                 = remove   # Remove spaces around #
sp_return_paren                 = add      # Force return (x);
pp_space_after                  = add      # Space after preprocessor directives

#
# Parentheses - MISRA Rule 12.1: Use parentheses for precedence
#
mod_paren_on_return             = remove   # Don't force return (x); just return x;
mod_full_paren_if_bool          = true     # Full parentheses in if conditions

#
# Blank lines - Consistent spacing
#
nl_max                          = 2        # Max 2 consecutive blank lines
nl_max_blank_in_func            = 2        # Max 2 blank lines in functions
eat_blanks_after_open_brace     = true     # Remove blank after {
eat_blanks_before_close_brace   = true     # Remove blank before }
nl_before_block_comment         = 2        # Two lines before block comment
nl_after_multiline_comment      = 1        # One line after multiline comment

#
# Comments - MISRA emphasizes good documentation
#
cmt_indent_multi                = true     # Indent multi-line comments
cmt_c_group                     = false     # Group C comments
cmt_c_nl_start                  = false    # No forced newline at comment start
cmt_c_nl_end                    = false    # No forced newline at comment end
cmt_star_cont                   = true    # Continue with * in multiline
cmt_sp_before_star_cont         = 0        # No space before * continuation
cmt_sp_after_star_cont          = 1        # One space after * continuation
sp_cmt_cpp_start                = add      # Space after // 
cmt_width                       = 80       # Wrap comments at 80 chars
cmt_reflow_mode                 = 1        # Reflow comments
cmt_convert_tab_to_spaces       = true     # Convert tabs to spaces in comments
cmt_cpp_to_c                    = true     # Convert C++ comments to C style

#
# Preprocessor - MISRA has specific rules for macros
#
pp_indent                       = remove   # Don't indent preprocessor
pp_indent_at_level              = true     # Don't indent at brace level
pp_indent_count                 = 0        # No preprocessor indentation
pp_space_after                  = remove   # Space after # directive
pp_space_count                  = 0        # 0 space after #
pp_indent_if                    = 0        # Don't indent #if blocks
pp_if_indent_code               = false    # Don't indent code in #if
pp_define_at_level              = false    # Don't indent #define at brace level
pp_indent_case                  = false    # Don't indent case in preprocessor
pp_indent_func_def              = false    # Don't indent function def in preprocessor
pp_indent_extern                = false    # Don't indent extern in preprocessor

#
# Alignment - Minimal alignment for MISRA
#
align_assign_span               = 0        # Don't align assignments
align_assign_thresh             = 0        # No assignment alignment threshold
align_enum_equ_span             = 0        # Don't align enum =
align_var_def_span              = 0        # Don't align variable definitions
align_var_def_inline            = false    # Don't align inline vars
align_var_def_colon             = false    # Don't align variable definitions with :
align_var_def_attribute         = false    # Don't align attributes
align_var_def_star_style        = 2        # Align * to variable name
align_var_def_amp_style         = 2        # Align & to variable name
align_typedef_span              = 0        # Don't align typedefs
align_typedef_star_style        = 2        # Align * in typedef to name
align_typedef_amp_style         = 2        # Align & in typedef to name
align_right_cmt_span            = 0        # Don't align right comments
align_func_params               = false    # Don't align function parameters
align_single_line_brace         = false    # Don't align single line braces
align_single_line_func          = false    # Don't align single line functions
align_pp_define_span            = 0        # Don't align #define values
align_pp_define_gap             = 0        # No gap for #define alignment
pp_ignore_define_body           = false    # Remove tabs in preprocessor
align_struct_init_span          = 0        # Don't align struct initializers
align_left_shift                = false    # Don't align << operators
align_assign_decl_func          = 0        # Don't align in functions
align_var_struct_span           = 0        # Don't align struct members
align_var_struct_thresh         = 0        # No threshold for struct alignment
align_var_struct_gap            = 0        # No gap for struct alignment
align_pp_define_together        = false    # Don't group defines for alignment
# align_pointer_decl / align_pointer_func not supported by Uncrustify ≤ 0.75; omitted.

#
# One-liners - MISRA discourages (one statement per line)
#
nl_if_leave_one_liners          = false    # Break one-line if statements
nl_while_leave_one_liners       = false    # Break one-line while loops  
nl_for_leave_one_liners         = false    # Break one-line for loops
nl_func_leave_one_liners        = false    # Break one-line functions
nl_enum_leave_one_liners        = false    # Break one-line enums
nl_create_if_one_liner          = false    # Don't create one-line if
nl_create_for_one_liner         = false    # Don't create one-line for
nl_create_while_one_liner       = false    # Don't create one-line while
nl_create_func_def_one_liner    = false    # Don't create one-line functions
nl_split_if_one_liner           = true     # Split existing one-line ifs
nl_split_for_one_liner          = true     # Split existing one-line fors
nl_split_while_one_liner        = true     # Split existing one-line whiles

#
# Switch statements - MISRA Rule 16.3: Every switch needs break
#
mod_case_brace                  = add   # Force braces on case
mod_move_case_break             = true    # Keep break where it is
nl_before_case                  = true      # Blank line before case
nl_after_case                   = false     # No blank after case
nl_case_colon_brace             = add      # Newline between case: and {

#
# MISRA-specific modifications
#
mod_add_long_function_closebrace_comment = 40  # Add comment for long functions
mod_add_long_switch_closebrace_comment = 40    # Add comment for long switches
mod_add_long_ifdef_endif_comment = 10          # Add comment for long #ifdef
mod_add_long_ifdef_else_comment = 10           # Add comment for #else
mod_sort_include                = false    # Don't sort includes (preserve logical grouping)
mod_sort_using                  = false    # Don't sort using statements
mod_sort_import                 = false    # Don't sort imports

#
# Line splitting - Keep statements clear
#
ls_for_split_full               = true     # Split long for statements
ls_func_split_full              = true     # Split long function signatures
ls_code_width                   = false    # Don't split based on width alone
pos_arith                       = lead     # Arithmetic operators at line start
pos_assign                      = trail    # Assignment at line end
pos_bool                        = lead     # Boolean operators at line start
pos_compare                     = lead     # Comparison at line start
pos_conditional                 = lead     # ?: at line start
pos_comma                       = trail    # Comma at line end

#
# Special MISRA considerations
#
# MISRA Rule 8.1: Functions must have prototype
# MISRA Rule 8.2: Function types must be complete
# MISRA Rule 14.3: Null statements must be on own line
# MISRA Rule 15.2: Goto should not be used (formatter can't enforce)
# MISRA Rule 15.6: Body of iteration/selection must be compound
# MISRA Rule 16.1: Functions shall not have variable number of arguments
# MISRA Rule 17.4: Array indexing only form of pointer arithmetic
# MISRA Rule 19.4: C macros only for certain uses
# MISRA Rule 19.15: Header guards required (formatter can't enforce)

#
# Additional safety-oriented settings
#
nl_after_if                    = add       # Blank line after if block
nl_after_for                   = add       # Blank line after for block  
nl_after_while                 = add       # Blank line after while block
nl_after_switch                = add       # Blank line after switch block
nl_after_do                    = add       # Blank line after do-while block
nl_before_return               = true      # Blank line before return
nl_after_return                = false     # No blank after return
nl_var_def_blk_end_func_top    = 1         # Blank after variable declarations
nl_var_def_blk_end             = 1         # Empty newlines after a block of variable definitions
nl_before_func_body_def        = 0         # No blank before function body
nl_before_func_body_proto      = 0         # No blank before prototype body


# Remove extra spaces after case keyword
sp_before_case_colon            = remove   # No space before : in case
sp_case_label                   = force    # Force single space after case keyword

# Or if the above doesn't work in your version, try:
sp_before_case_colon            = remove   # No space before colon