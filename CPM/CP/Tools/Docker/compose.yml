services:
  # Build STM32 firmware (arm-none-eabi-gcc)
  build-arm:
    build:
      context: ../..
      dockerfile: Tools/Docker/Dockerfile.arm
    volumes:
      - ../..:/workspace:z
    working_dir: /workspace
    command: >
      bash -c "
        rm -rf build/Docker-STM32-Release &&
        cmake --preset Docker-STM32-Release &&
        cmake --build --preset Docker-STM32-Release
      "

  # Run host unit + integration tests with coverage
  build-test:
    build:
      context: ../..
      dockerfile: Tools/Docker/Dockerfile.test
    volumes:
      - ../..:/workspace:z
      - /workspace/build/Host-Test
    working_dir: /workspace
    command: >
      bash -c "
        cmake --preset Docker-Host-Test &&
        cmake --build --preset Docker-Host-Test &&
        cd /tmp/docker-host-test &&
        find . -name '*.gcda' -delete &&
        ctest --output-on-failure &&
        mkdir -p /workspace/build/coverage-report &&
        gcovr --config /workspace/gcovr.cfg --gcov-ignore-parse-errors --root /workspace --html-details /workspace/build/coverage-report/index.html --xml /workspace/build/coverage-report/coverage.xml --print-summary .
      "

  # Interactive development shell with ARM toolchain
  shell-arm:
    build:
      context: ../..
      dockerfile: Tools/Docker/Dockerfile.arm
    volumes:
      - ../..:/workspace:z
    working_dir: /workspace
    stdin_open: true
    tty: true

  # Interactive development shell for host testing
  shell-test:
    build:
      context: ../..
      dockerfile: Tools/Docker/Dockerfile.test
    volumes:
      - ../..:/workspace:z
    working_dir: /workspace
    stdin_open: true
    tty: true
